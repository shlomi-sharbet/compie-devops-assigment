name: Deploy Microservice to AWS (Zero-Downtime)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Workflow permissions
permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: compie-dev-compie-app
  ASG_NAME_PREFIX: compie-dev-asg

jobs:
  test-and-lint:
    name: Lint & Code Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi

      - name: Lint Python Code with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build-and-deploy:
    name: Build, ECR Push & ASG Rolling Update
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==============================================================================
      # Step 1: Secure CI/CD Authentication to AWS (Least-Privilege Dedicated User)
      # ==============================================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ==============================================================================
      # Step 2: Authenticate to Amazon ECR
      # ==============================================================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ==============================================================================
      # Step 3: Build & Push Docker Image with Automated Ascending Version
      # ==============================================================================
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          echo "Building Docker container image for version $VERSION..."
          FULL_IMAGE_NAME="$ECR_REGISTRY/$ECR_REPOSITORY:$VERSION"

          docker build \
            --build-arg APP_VERSION="$VERSION" \
            --build-arg DOCKER_IMAGE="$FULL_IMAGE_NAME" \
            -t $FULL_IMAGE_NAME \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./app

          echo "Pushing Docker container images to ECR..."
          docker push $FULL_IMAGE_NAME
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE_URI=$FULL_IMAGE_NAME" >> $GITHUB_ENV

      # ==============================================================================
      # Step 4: True Zero-Downtime Rollout (MinHealthyPercentage=100)
      # ==============================================================================
      - name: Trigger ASG Instance Refresh (Zero-Downtime Rolling Update)
        run: |
          echo "Locating Auto Scaling Group with prefix '$ASG_NAME_PREFIX'..."
          ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
            --region $AWS_REGION \
            --query "AutoScalingGroups[?contains(AutoScalingGroupName, '$ASG_NAME_PREFIX')].AutoScalingGroupName | [0]" \
            --output text)

          if [ "$ASG_NAME" == "None" ] || [ -z "$ASG_NAME" ]; then
            echo "Error: Could not find active Auto Scaling Group with prefix $ASG_NAME_PREFIX"
            exit 1
          fi

          echo "Found active ASG: $ASG_NAME"
          echo "Starting Rolling Instance Refresh with MinHealthyPercentage=100 (Zero Downtime)..."

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --region "$AWS_REGION" \
            --preferences '{"MinHealthyPercentage": 100, "InstanceWarmup": 120}' \
            --query "InstanceRefreshId" \
            --output text)

          echo "Instance Refresh launched with ID: $REFRESH_ID"
          echo "Monitoring rollout progression until completion..."

          # Poll for completion
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --region "$AWS_REGION" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            PERCENTAGE=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --region "$AWS_REGION" \
              --query "InstanceRefreshes[0].PercentageComplete" \
              --output text)

            echo "Current Rollout Status: $STATUS ($PERCENTAGE% completed)"

            if [ "$STATUS" == "Successful" ]; then
              echo "✅ Instance Refresh completed successfully! All instances running latest code."
              break
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ]; then
              echo "❌ Instance Refresh failed or was cancelled with status: $STATUS"
              exit 1
            fi

            sleep 20
          done

          