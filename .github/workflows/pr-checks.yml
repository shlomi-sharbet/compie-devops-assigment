name: PR Pre-Merge Checks

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  code-quality-and-docker:
    name: Code Quality & Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies & Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx
          if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi

      - name: Run Python Linting (flake8)
        run: |
          # Stop build on syntax errors or undefined names
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings and code complexity check
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Unit Tests (pytest)
        run: |
          if [ -d tests ]; then
            pytest -v tests/
          else
            echo "Running basic import & route verification..."
            python -c "import app.main as app; print('App imported successfully!')"
          fi

      - name: Verify Dockerfile Build
        run: |
          echo "Verifying Dockerfile compiles and builds cleanly..."
          docker build -t compie-app-pr-test ./app

  terraform-validation:
    name: Terraform Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform Format Check (fmt)
        run: |
          terraform fmt -check -recursive terraform/

      - name: Validate Dev Environment
        run: |
          cd terraform/environments/dev
          terraform init -backend=false
          terraform validate

      - name: Validate Staging Environment
        run: |
          if [ -d terraform/environments/staging ]; then
            cd terraform/environments/staging
            terraform init -backend=false
            terraform validate
          fi
